server {
    server_name www.lunzo.site lunzo.site;

    # Public compliance pages use a dedicated static root and must be resolved
    # before the Vue SPA catch-all below.
    location ~ ^/(privacy|terms|support|account-deletion)/?$ {
        root /home/ubuntu/AI_skin_public;
        try_files /$1.html =404;

        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSS is embedded in each standalone HTML file, so inline styles are
        # allowed while scripts and all other external resources stay blocked.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Keep the URLs already referenced by the mobile-app review materials.
    location = /privacy-policy {
        rewrite ^ /privacy last;
    }

    location = /terms-of-use {
        rewrite ^ /terms last;
    }

    # Existing authenticated web application.
    location / {
        root /home/ubuntu/AI_skin_vue/aiskin/dist;
        try_files $uri $uri/ /index.html;
    }

    # Existing backend API.
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        alias /home/ubuntu/AI_skin_backend/AISkin_backend/uploads;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 20M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.lunzo.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lunzo.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name www.lunzo.site lunzo.site;
    return 301 https://$host$request_uri;
}
